name: release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      dry_run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: |
          npm install --global npm@12.0.2
          bun install --frozen-lockfile

      - name: Check out pinned authoritative IPH
        env:
          IPH_COMMIT: 13fc4ec865be42beba2dac9e035ca478ab2e9435
        run: |
          git clone --filter=blob:none https://github.com/Robin9989Law/innovation-proposition-hunting.git "$RUNNER_TEMP/innovation-proposition-hunting"
          git -C "$RUNNER_TEMP/innovation-proposition-hunting" checkout --detach "$IPH_COMMIT"
          echo "IPH_SKILL_DIR=$RUNNER_TEMP/innovation-proposition-hunting" >> "$GITHUB_ENV"

      - name: Verify package metadata matches this provenance source
        env:
          EXPECTED_GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/check-package.ts

      - name: Verify harness release tarball
        env:
          EXPECTED_GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run release:check

      - name: Verify authoritative IPH regression suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest "$IPH_SKILL_DIR/tests" -q

      - name: Refuse an already-published version
        if: ${{ ! inputs.dry_run }}
        run: |
          package_id="$(node -p 'const p=require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$package_id" version >/dev/null 2>&1; then
            echo "Refusing to overwrite existing npm version: $package_id" >&2
            exit 1
          fi

      - name: Pack dry run
        if: ${{ inputs.dry_run }}
        run: npm pack --dry-run --json

      - name: Publish to npm with provenance
        if: ${{ ! inputs.dry_run }}
        run: npm publish --provenance --access public --tag "${{ inputs.dist_tag }}"
