name: release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
      dry_run:
        description: Build and verify without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: |
          npm install --global npm@12.0.2
          bun install --frozen-lockfile

      - name: Check out pinned authoritative IPH
        env:
          IPH_COMMIT: 13fc4ec865be42beba2dac9e035ca478ab2e9435
        run: |
          git clone --filter=blob:none https://github.com/Robin9989Law/innovation-proposition-hunting.git "$RUNNER_TEMP/innovation-proposition-hunting"
          git -C "$RUNNER_TEMP/innovation-proposition-hunting" checkout --detach "$IPH_COMMIT"
          echo "IPH_SKILL_DIR=$RUNNER_TEMP/innovation-proposition-hunting" >> "$GITHUB_ENV"

      - name: Bind package metadata to this provenance source
        env:
          EXPECTED_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm pkg set repository.type=git repository.url="https://github.com/${GITHUB_REPOSITORY}"
          bun scripts/check-package.ts

      - name: Verify harness release tarball
        env:
          EXPECTED_GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run release:check

      - name: Verify authoritative IPH regression suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest "$IPH_SKILL_DIR/tests" -q

      - name: Refuse an already-published version
        if: ${{ ! inputs.dry_run }}
        run: |
          package_id="$(node -p 'const p=require("./package.json"); `${p.name}@${p.version}`')"
          if npm view "$package_id" version >/dev/null 2>&1; then
            echo "Refusing to overwrite existing npm version: $package_id" >&2
            exit 1
          fi

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        run: npm publish --dry-run --access public --tag "${{ inputs.dist_tag }}"

      - name: Configure bootstrap token when present
        if: ${{ ! inputs.dry_run }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set registry https://registry.npmjs.org --location=user
          if [[ -n "$NPM_TOKEN" ]]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
          else
            npm config delete //registry.npmjs.org/:_authToken --location=user || true
          fi

      - name: Publish to npm with provenance
        if: ${{ ! inputs.dry_run }}
        run: npm publish --provenance --access public --tag "${{ inputs.dist_tag }}"
