name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: bun install --frozen-lockfile

      - name: Check out pinned authoritative IPH
        env:
          IPH_COMMIT: 13fc4ec865be42beba2dac9e035ca478ab2e9435
        run: |
          git clone --filter=blob:none https://github.com/Robin9989Law/innovation-proposition-hunting.git "$RUNNER_TEMP/innovation-proposition-hunting"
          git -C "$RUNNER_TEMP/innovation-proposition-hunting" checkout --detach "$IPH_COMMIT"
          echo "IPH_SKILL_DIR=$RUNNER_TEMP/innovation-proposition-hunting" >> "$GITHUB_ENV"

      - name: Typecheck, unit/install tests, real OMP loader E2E, and release tarball check
        run: bun run release:check

      - name: Check OMP plugin packaging
        run: ./node_modules/.bin/omp plugin doctor . --json

      - name: Run authoritative IPH regression suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest "$IPH_SKILL_DIR/tests" -q
