name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: bun install --frozen-lockfile

      - name: Check out pinned authoritative IPH
        run: |
          IPH_COMMIT="$(node -p 'require("./config/iph-lock.json").commit')"
          test -n "$IPH_COMMIT"
          git clone --filter=blob:none https://github.com/Robin9989Law/innovation-proposition-hunting.git "$RUNNER_TEMP/innovation-proposition-hunting"
          git -C "$RUNNER_TEMP/innovation-proposition-hunting" checkout --detach "$IPH_COMMIT"
          echo "IPH_SKILL_DIR=$RUNNER_TEMP/innovation-proposition-hunting" >> "$GITHUB_ENV"

      - name: Typecheck, unit/install tests, real OMP loader E2E, and release tarball check
        run: bun run release:check

      - name: Check OMP plugin packaging
        run: ./node_modules/.bin/omp plugin doctor . --json

      - name: Run authoritative IPH regression suite
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest "$IPH_SKILL_DIR/tests" -q
